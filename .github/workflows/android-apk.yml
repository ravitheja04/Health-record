name: Android APK

# Builds an installable APK on GitHub's free runners (no Expo account needed).
# Started by hand only (Actions -> Android APK -> Run workflow), so features can
# pile up and be built when wanted. Every run uploads the APK as a workflow
# artifact; runs on main also publish it to the "latest-android" release so it
# can be downloaded straight to a phone.

on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Google keys for family sync (docs/google-drive-setup.md). Optional: without
    # them the app builds as before and the Sync screen explains how to set it up.
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test

      - name: Generate native Android project
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      - name: Build release APK
        working-directory: android
        # Real phones only need the ARM builds; skipping x86 halves build time.
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/family-health-registry.apk

      - uses: actions/upload-artifact@v4
        with:
          name: family-health-registry-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish to the latest-android release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: Latest Android build
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            Built from ${{ github.sha }}. Download the .apk on your Android phone and open it to install.
            Signed with a development key: fine for personal and family use, not for the Play Store.
